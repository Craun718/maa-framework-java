name: publish

on:
  push:
    tags:
      - "v*"
  workflow_call:

permissions:
  contents: read

jobs:
  publish-maven:
    name: publish to Maven Central
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Validate Release Version
        shell: bash
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          file_version=$(tr -d '[:space:]' < .maa-framework-version | sed 's/^v//')

          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            echo "::error::Maven releases must be triggered by a version tag."
            exit 1
          fi
          if [[ -z "${tag_version}" || "${tag_version}" != "${file_version}" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match .maa-framework-version ${file_version}."
            exit 1
          fi

      - name: Check Publishing Credentials
        shell: bash
        env:
          CENTRAL_PORTAL_USERNAME: ${{ secrets.CENTRAL_PORTAL_USERNAME }}
          CENTRAL_PORTAL_PASSWORD: ${{ secrets.CENTRAL_PORTAL_PASSWORD }}
          CENTRAL_PORTAL_SIGNING_KEY: ${{ secrets.CENTRAL_PORTAL_SIGNING_KEY }}
          CENTRAL_PORTAL_SIGNING_PASSWORD: ${{ secrets.CENTRAL_PORTAL_SIGNING_PASSWORD }}
        run: |
          for credential in \
            CENTRAL_PORTAL_USERNAME \
            CENTRAL_PORTAL_PASSWORD \
            CENTRAL_PORTAL_SIGNING_KEY \
            CENTRAL_PORTAL_SIGNING_PASSWORD
          do
            if [[ -z "${!credential}" ]]; then
              echo "::error::Missing required secret ${credential}."
              exit 1
            fi
          done

      - name: Publish Signed Release
        shell: bash
        env:
          CENTRAL_PORTAL_USERNAME: ${{ secrets.CENTRAL_PORTAL_USERNAME }}
          CENTRAL_PORTAL_PASSWORD: ${{ secrets.CENTRAL_PORTAL_PASSWORD }}
          CENTRAL_PORTAL_SIGNING_KEY: ${{ secrets.CENTRAL_PORTAL_SIGNING_KEY }}
          CENTRAL_PORTAL_SIGNING_KEY_ID: ${{ secrets.CENTRAL_PORTAL_SIGNING_KEY_ID }}
          CENTRAL_PORTAL_SIGNING_PASSWORD: ${{ secrets.CENTRAL_PORTAL_SIGNING_PASSWORD }}
        run: >-
          ./gradlew publishAggregationToCentralPortal
          -Psigning.enabled=true --console=plain
