name: test

on:
  push:
    branches:
      - "**"
    paths-ignore:
      - "README.md"
      - "README.en.md"
  pull_request:
    paths-ignore:
      - "README.md"
      - "README.en.md"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build Library and Examples
        shell: bash
        run: ./gradlew :lib:build :examples:compileJava --console=plain

      - name: Stage Java Library
        shell: bash
        run: |
          mkdir -p staging
          cp lib/build/libs/lib.jar staging/maa-framework-java.jar

      - name: Upload Java Library
        uses: actions/upload-artifact@v7
        with:
          name: maa-framework-java-lib
          path: staging/maa-framework-java.jar
          if-no-files-found: error

  test:
    name: test ${{ matrix.maa_prefix }} ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
            maa_prefix: MAA-linux
          - os: windows-latest
            arch: x86_64
            maa_prefix: MAA-win
          - os: macos-latest
            arch: aarch64
            maa_prefix: MAA-macos

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Read MaaFramework Version
        id: maa_version
        shell: bash
        run: echo "tag=$(tr -d '[:space:]' < .maa-framework-version)" >> "$GITHUB_OUTPUT"

      - name: Download MaaFramework
        uses: robinraju/release-downloader@v1.13
        with:
          repository: MaaXYZ/MaaFramework
          tag: ${{ steps.maa_version.outputs.tag }}
          fileName: "${{ matrix.maa_prefix }}-${{ matrix.arch }}*"
          out-file-path: deps
          extract: true

      - name: Run FFI Surface Check
        shell: bash
        run: ./scripts/check-ffi-surface.sh deps

      - name: Run Tests
        shell: bash
        env:
          MAA_FRAMEWORK_LIB_DIR: ${{ github.workspace }}/deps/bin
        run: ./gradlew :lib:test

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.maa_prefix }}-${{ matrix.arch }}-test-reports
          path: |
            lib/build/reports/tests/test
            lib/build/test-results/test
          if-no-files-found: warn
