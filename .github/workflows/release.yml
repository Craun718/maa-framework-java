name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        type: string
      run_id:
        description: CI run that contains the release artifacts
        required: true
        type: string

permissions:
  contents: read

jobs:
  ci:
    name: CI
    if: github.event_name == 'push'
    uses: ./.github/workflows/test.yml

  package:
    name: package ${{ matrix.platform }}
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: win-x86_64
            source_dir: MAA-win-x86_64
            maa_file_name: MAA-win-x86_64*
          - platform: win-aarch64
            source_dir: MAA-win-aarch64
            maa_file_name: MAA-win-aarch64*
          - platform: linux-x86_64
            source_dir: MAA-linux-x86_64
            maa_file_name: MAA-linux-x86_64*
          - platform: linux-aarch64
            source_dir: MAA-linux-aarch64
            maa_file_name: MAA-linux-aarch64*
          - platform: macos-x86_64
            source_dir: MAA-macos-x86_64
            maa_file_name: MAA-macos-x86_64*
          - platform: macos-aarch64
            source_dir: MAA-macos-aarch64
            maa_file_name: MAA-macos-aarch64*
          - platform: android-x86_64
            source_dir: MAA-android-x86_64
            maa_file_name: MAA-android-x86_64*
          - platform: android-arm64-v8a
            source_dir: MAA-android-aarch64
            maa_file_name: MAA-android-aarch64*

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Read MaaFramework Version
        id: maa_version
        shell: bash
        run: echo "tag=$(tr -d '[:space:]' < .maa-framework-version)" >> "$GITHUB_OUTPUT"

      - name: Download MaaFramework
        uses: robinraju/release-downloader@v1.13
        with:
          repository: MaaXYZ/MaaFramework
          tag: ${{ steps.maa_version.outputs.tag }}
          fileName: "${{ matrix.maa_file_name }}"
          out-file-path: deps
          extract: true

      - name: Stage Release Directory
        shell: bash
        run: |
          mkdir -p releases
          mv deps releases/${{ matrix.source_dir }}

      - name: Build Official Release Archive
        shell: bash
        env:
          MAA_FRAMEWORK_RELEASES: ${{ github.workspace }}/releases
          MAA_FRAMEWORK_OUTPUT_DIR: ${{ github.workspace }}/dist
        run: ./scripts/package-official-release.sh

      - name: Upload Release Archive
        uses: actions/upload-artifact@v7
        with:
          name: maa-framework-java-${{ matrix.platform }}-ci
          path: dist/*.zip

  release:
    needs: [ci, package]
    if: >-
      always() && (
        github.event_name == 'workflow_dispatch' ||
        needs.ci.result == 'success' && needs.package.result == 'success'
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Validate Release Inputs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          RUN_ID: ${{ inputs.run_id || github.run_id }}
        run: |
          tag_version="${RELEASE_TAG#v}"
          file_version=$(tr -d '[:space:]' < .maa-framework-version | sed 's/^v//')

          if [[ -z "${tag_version}" || "${tag_version}" != "${file_version}" ]]; then
            echo "::error::Tag ${RELEASE_TAG} does not match .maa-framework-version ${file_version}."
            exit 1
          fi

          run_sha="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" --jq .head_sha)"
          tag_sha="$(git rev-parse HEAD)"
          if [[ "${run_sha}" != "${tag_sha}" ]]; then
            echo "::error::Run ${RUN_ID} was built from ${run_sha}, not tag ${RELEASE_TAG} (${tag_sha})."
            exit 1
          fi

      - name: Download Release Archives
        uses: actions/download-artifact@v8
        with:
          pattern: maa-framework-java-*-ci
          path: dist
          merge-multiple: true
          run-id: ${{ inputs.run_id || github.run_id }}
          github-token: ${{ github.token }}

      - name: Download Java Library
        uses: actions/download-artifact@v8
        with:
          name: maa-framework-java-lib
          path: artifacts
          run-id: ${{ inputs.run_id || github.run_id }}
          github-token: ${{ github.token }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          prerelease: ${{ contains(inputs.tag || github.ref_name, '-alpha') || contains(inputs.tag || github.ref_name, '-beta') || contains(inputs.tag || github.ref_name, '-rc') }}
          files: |
            dist/*.zip
            artifacts/maa-framework-java.jar
